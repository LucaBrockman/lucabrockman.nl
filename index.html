<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111412">
  <meta name="description" content="De persoonlijke pagina van Luca Brockman.">
  <title>Luca Brockman</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111412;
      --panel: #191e1a;
      --line: #313a33;
      --text: #f4f3ea;
      --muted: #aab5a9;
      --accent: #bded91;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 78% 18%, #243327 0, transparent 36%),
        radial-gradient(circle at 10% 88%, #1b2820 0, transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    main {
      position: relative;
      width: min(100%, 760px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 24px 80px #0005;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .26;
      background-image: linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(140deg, black, transparent 75%);
    }

    header, section, footer { position: relative; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 28px 36px;
      border-bottom: 1px solid var(--line);
    }

    .identity { display: flex; align-items: center; gap: 12px; }

    .mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid #54724d;
      border-radius: 12px;
      background: #273726;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .name { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
    .label { color: var(--muted); font-size: 12px; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px #bded911a;
    }

    section { padding: 74px 36px 86px; }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 660px;
      margin: 0;
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 700;
      letter-spacing: -.075em;
      line-height: .99;
    }

    h1 span { color: var(--accent); }

    .intro {
      max-width: 540px;
      margin: 34px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2.5vw, 20px);
      line-height: 1.6;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 36px;
      padding: 13px 17px;
      border: 1px solid #58764e;
      border-radius: 11px;
      background: #273726;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }

    .link:hover { background: #30492c; transform: translateY(-2px); }
    .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 36px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      header { padding: 22px; }
      section { padding: 66px 22px 76px; }
      footer { padding: 20px 22px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="identity">
        <div class="mark" aria-hidden="true">LB</div>
        <div>
          <div class="name">Luca Brockman</div>
          <div class="label">Persoonlijke pagina</div>
        </div>
      </div>
      <div class="status">Welkom</div>
    </header>

    <section aria-labelledby="intro-title">
      <p class="eyebrow">Aangenaam</p>
      <h1 id="intro-title">Hoi, ik ben <span>Luca.</span></h1>
      <p class="intro">Leuk dat je er bent. Ik ben graag bezig met technologie, netwerken en nieuwe ideeën. Dit is mijn kleine plek op het web.</p>
      <a class="link" href="https://ps.lucabrockman.nl/">Bekijk mijn portfolio <span aria-hidden="true">↗</span></a>
    </section>

    <footer>
      <span>Luca Brockman</span>
      <span>Gemaakt met aandacht.</span>
    </footer>
  </main>
</body>
</html>
