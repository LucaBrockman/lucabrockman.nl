<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111412">
  <title>Pagina niet gevonden · Luca Brockman</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 72% 20%, #263527, transparent 40%), #111412;
      color: #f4f3ea;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid #313a33;
      border-radius: 24px;
      background: #191e1a;
      box-shadow: 0 24px 80px #0005;
    }
    .code { margin: 0 0 22px; color: #bded91; font-size: 13px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(42px, 9vw, 68px); letter-spacing: -.065em; line-height: 1; }
    p:not(.code) { max-width: 430px; margin: 25px 0 0; color: #aab5a9; font-size: 18px; line-height: 1.6; }
    a { display: inline-block; margin-top: 26px; color: #bded91; font-weight: 700; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid #bded91; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 / NIET GEVONDEN</p>
    <h1>Hier is niets te vinden.</h1>
    <p>Deze pagina bestaat niet of is verplaatst.</p>
    <a href="/">Terug naar het begin ↗</a>
  </main>
</body>
</html>
